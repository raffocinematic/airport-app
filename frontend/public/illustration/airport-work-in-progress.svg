<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <title>Aereo in costruzione in un piccolo cantiere</title>

  <!-- Sfondo -->
  <ellipse cx="320" cy="212" rx="250" ry="122" fill="#eff8ff"/>
  <circle cx="110" cy="110" r="9" fill="#fde68a"/>
  <circle cx="490" cy="125" r="6" fill="#bae6fd"/>

  <!-- Gru -->
  <g stroke="#0284c7" stroke-width="3" stroke-linejoin="round">
    <rect x="548" y="80" width="16" height="250" fill="#e0f2fe"/>
    <rect x="288" y="66" width="294" height="14" rx="4" fill="#7dd3fc"/>
    <path d="M300 66 556 36V66" fill="none"/>
    <rect x="575" y="60" width="28" height="30" rx="3" fill="#bae6fd"/>
    <path d="m548 110 16 30-16 30 16 30-16 30 16 30-16 30"
          fill="none" stroke="#7dd3fc"/>
    <path d="M356 80V140" fill="none"/>
    <path d="M356 140v12c0 12-18 12-18 0"
          fill="none" stroke-linecap="round"/>
    <path d="m347 158-19 16m19-16 30 16" fill="none"/>
  </g>

  <!-- Ala sospesa, ancora da montare -->
  <path d="m305 186 41-28h48l-65 28Z"
        fill="#bae6fd" stroke="#0284c7" stroke-width="3"
        stroke-linejoin="round"/>

  <!-- Coda -->
  <path d="m162 229-25-62h30l70 62Z"
        fill="#7dd3fc" stroke="#0369a1" stroke-width="4"
        stroke-linejoin="round"/>

  <!-- Fusoliera -->
  <path d="M157 229h284c27 0 57 14 70 30-17 14-41 21-70 21H164
           c-22 0-36-13-36-26 0-14 11-25 29-25Z"
        fill="#ffffff" stroke="#0369a1" stroke-width="4"
        stroke-linejoin="round"/>

  <!-- Cabina e finestrini -->
  <path d="M451 237c13 3 24 8 32 14h-31Z" fill="#0369a1"/>
  <g fill="#38bdf8">
    <circle cx="220" cy="250" r="6"/>
    <circle cx="246" cy="250" r="6"/>
    <circle cx="272" cy="250" r="6"/>
    <circle cx="298" cy="250" r="6"/>
  </g>

  <!-- Sezione in lavorazione -->
  <rect x="350" y="229" width="48" height="51" fill="#eff8ff"/>
  <path d="M350 229v51m48-51v51"
        stroke="#0284c7" stroke-width="3" stroke-dasharray="5 5"/>
  <path d="m355 237 38 34m0-34-38 34"
        stroke="#bae6fd" stroke-width="3"/>

  <!-- Ala montata -->
  <path d="m292 262-50 46h48l64-46"
        fill="#7dd3fc" stroke="#0369a1" stroke-width="4"
        stroke-linejoin="round"/>

  <!-- Supporti di montaggio -->
  <g fill="none" stroke="#0369a1" stroke-width="4"
     stroke-linecap="round">
    <path d="M206 280v50m-18 0h36"/>
    <path d="M433 280v50m-18 0h36"/>
  </g>

  <!-- Barriera del cantiere -->
  <g stroke="#d97706" stroke-width="3">
    <path d="M80 311v19m84-19v19" fill="none"/>
    <rect x="66" y="293" width="112" height="18" rx="3"
          fill="#fef3c7"/>
    <path d="m78 294 12 16m12-16 12 16m12-16 12 16m12-16 12 16"/>
  </g>

  <!-- Cono -->
  <path d="m500 330 15-34 15 34Z"
        fill="#fbbf24" stroke="#d97706" stroke-width="3"
        stroke-linejoin="round"/>
  <path d="M508 315h14" stroke="#ffffff" stroke-width="5"/>

  <!-- Terreno -->
  <path d="M54 332h552" stroke="#bed5e5" stroke-width="3"
        stroke-linecap="round"/>
</svg>
