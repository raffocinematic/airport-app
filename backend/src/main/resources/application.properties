spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/airport_app
spring.datasource.username=airport_user
spring.datasource.password=${AIRPORT_APP_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

app.jwt.secret=${AIRPORT_APP_JWT_SECRET}

server.port=8080

app.security.cors.allowed-origins[0]=http://localhost:4200
app.security.cors.allowed-origins[1]=http://127.0.0.1:4200
app.security.cors.allowed-origins[2]=http://localhost:4300
app.security.cors.allowed-origins[3]=http://127.0.0.1:4300

# Limite alle richieste di login per indirizzo IP
app.security.login-rate-limit.max-requests=10
app.security.login-rate-limit.window=60s
app.security.login-rate-limit.max-tracked-ips=10000