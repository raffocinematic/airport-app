databaseChangeLog:
  - changeSet:
      id: 004-create-destination-cities
      author: raffo
      changes:
        - createTable:
            tableName: destination_cities
            columns:
              - column:
                  # Identificativo GeoNames: non generato dal database.
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: varchar(200)
                  constraints:
                    nullable: false

              - column:
                  name: country_code
                  type: varchar(2)
                  constraints:
                    nullable: false

              - column:
                  name: admin1_name
                  type: varchar(200)

              - column:
                  name: admin2_name
                  type: varchar(200)

              - column:
                  name: latitude
                  type: decimal(9,6)
                  constraints:
                    nullable: false

              - column:
                  name: longitude
                  type: decimal(9,6)
                  constraints:
                    nullable: false

        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE destination_cities
                  ADD CONSTRAINT ck_destination_cities_id
                      CHECK (id > 0),

                  ADD CONSTRAINT ck_destination_cities_name
                      CHECK (
                          name = btrim(name)
                          AND char_length(name) > 0
                      ),

                  ADD CONSTRAINT ck_destination_cities_country
                      CHECK (country_code IN ('IT', 'GB')),

                  ADD CONSTRAINT ck_destination_cities_coordinates
                      CHECK (
                          latitude BETWEEN -90 AND 90
                          AND longitude BETWEEN -180 AND 180
                      );