databaseChangeLog:
  - changeSet:
      id: 006-add-route-destination-city
      author: raffo
      changes:
        - addColumn:
            tableName: routes
            columns:
              - column:
                  # Collegamento alla città del catalogo GeoNames.
                  name: destination_city_id
                  type: bigint
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableName: routes
            baseColumnNames: destination_city_id
            referencedTableName: destination_cities
            referencedColumnNames: id
            constraintName: fk_routes_destination_city
            onDelete: RESTRICT

        - createIndex:
            tableName: routes
            indexName: idx_routes_destination_city_id
            columns:
              - column:
                  name: destination_city_id